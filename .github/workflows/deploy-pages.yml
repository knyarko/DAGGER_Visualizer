name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: network-ui/package-lock.json

      - name: Install dependencies
        working-directory: network-ui
        run: npm ci

      - name: Build
        working-directory: network-ui
        # BASE_PATH must end with a trailing slash and match the deployed repo name.
        # github.event.repository.name resolves to the current repo, so forks just work.
        # VITE_BUILD_* are picked up by src/lib/buildInfo.ts to render a visible
        # build stamp in the app — handy for confirming which deploy is live.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: BASE_PATH="/${{ github.event.repository.name }}/" npm run build

      - name: Add SPA 404 fallback
        # GitHub Pages serves the root index.html for /, but any other path
        # would return 404. Copying index.html to 404.html makes deep links work
        # (no-op today since we have no router, but harmless and future-proof).
        run: cp network-ui/dist/index.html network-ui/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: network-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
